[project]
name = "findex"
version = "0.4.0"
description = "Search engine CLI tool with BM25 and TF-IDF ranking"
readme = "README.md"
authors = [
    { name = "w1der-leg", email = "stepan4enco2007@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.28.1",
    "fastapi>=0.163.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.16.3",
    "jinja2>=3.1.6",
]

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "pyright>=1.1.380",
    "ruff>=0.16.7",
    "matplotlib>=3.11.2",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
